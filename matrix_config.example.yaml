# Shape of the runtime configuration consumed by the soundboard.
# Prefer generate_matrix_registration.py: it creates this file and the matching
# homeserver registration with secure independent tokens. This example is
# deliberately disabled and must not be installed as-is.
enabled: false
homeserver_url: "https://matrix.example.com"
server_name: "matrix.example.com"
sender_localpart: "soundbot"
as_token: "REPLACE_WITH_GENERATED_AS_TOKEN"
hs_token: "REPLACE_WITH_GENERATED_HS_TOKEN"

# Default deny: commands and invitations are accepted only for these room IDs.
allowed_rooms:
  - "!room_id:matrix.example.com"
# Rooms the bot should join when this process starts (must also be allowed above).
startup_rooms: []
# If true, rooms successfully joined by this process may issue commands too.
allow_all_joined_rooms: false
command_prefix: "!"
