<!DOCTYPE html>
<html>
<head>
    <title>~Soundboard 98~ ACCESS DENIED</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #000; color: #00FF00; font-family: "Courier New", Courier, monospace; margin: 0; }
        .box {
            max-width: 560px;
            margin: 12vh auto 0;
            border: 2px solid #FF0000;
            background: #000080;
            padding: 20px;
            text-align: center;
            box-shadow: 8px 8px 0 #330000;
        }
        h1 { color: #FF0000; margin: 0 0 12px; font-size: 22px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        p { word-break: break-word; }
        a { color: #FFFF00; }
    </style>
</head>
<body>
    <div class="box">
        <h1>{% if status == 404 %}404 NOT FOUND{% elif status == 403 %}ACCESS DENIED{% else %}PLEASE SIGN IN{% endif %}</h1>
        <p>{{ error }}</p>
        {% if status == 401 %}<p>The admin area is opened through the single sign-on in front of the soundboard.</p>{% endif %}
        <p><a href="{{ url_for('index') }}">[BACK TO SOUNDBOARD]</a></p>
    </div>
</body>
</html>
